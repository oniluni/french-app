<style>
body{margin:0}
.tg{width:51px;height:31px;flex:none;border-radius:16px;background:var(--s4);position:relative}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fafafa}
.tg[aria-checked="true"]{background:var(--acc)}
.tg[aria-checked="true"]::after{left:22px;background:#0a0a0a}
.sl{height:4px;border-radius:2px;background:var(--s4);position:relative;flex:1}
.sl i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--acc)}
.sl b{position:absolute;top:-10px;width:24px;height:24px;border-radius:50%;background:#fafafa;margin-left:-12px}
</style>
</helmet>
<div class="app ph" style="width:393px;height:852px">
<div class="sb" aria-hidden="true"><span>9:41</span><i class="sig"></i><i class="wifi"></i><i class="bat"></i></div>
<div class="nb"><button class="gb gl" aria-label="Назад"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5l-7 7 7 7"></path></svg></button><b>Настройки</b></div>
<main class="sc">

<div class="row" style="flex-wrap:wrap;row-gap:8px"><span class="grow">Скорость</span><span class="m mono">0.8×</span><div class="hst g12" style="width:100%"><span class="c1 m">медленно</span><div class="sl" role="slider" aria-label="Скорость озвучки" aria-valuenow="0.8" aria-valuemin="0.5" aria-valuemax="1.2" tabindex="0"><i style="width:43%"></i><b style="left:43%"></b></div><span class="c1 m">обычно</span></div></div>
</div>

<h2 class="sec">Отображение</h2>

<div class="row"><span class="grow">Показывать IPA</span><button class="tg" role="switch" aria-checked="true" aria-label="Показывать IPA"></button></div>
<div class="row"><span class="grow">Разметка произношения</span><button class="tg" role="switch" aria-checked="true" aria-label="Разметка произношения"></button></div>
<button class="row"><span class="grow">Размер текста</span><span class="m">как в системе</span><svg class="ic sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg></button>
</div>

<h2 class="sec">Повторения</h2>
<div class="card">
<button class="row"><span class="grow">Напоминание</span><span class="m mono">20:00</span><svg class="ic sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg></button>
<button class="row"><span class="grow">Резервная копия</span><span class="m">2 ноября</span><svg class="ic sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg></button>
</div>

<h2 class="sec">О приложении</h2>

<button class="row"><span class="grow">Данные и лицензии</span><svg class="ic sm chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5"></path></svg></button>
