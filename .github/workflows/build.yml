name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Core tests
        run: swift test --package-path Core

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild test -project French.xcodeproj -scheme French \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -resultBundlePath build/ui.xcresult | xcbeautify

      - name: Export screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path build/ui.xcresult --output-path build/screenshots

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: build/screenshots

      # No certificate, no provisioning profile: the IPA is signed later on the phone
      # (ESign or any other sideloading tool), so the build needs no Apple account.
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild archive -project French.xcodeproj -scheme French -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/French.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} | xcbeautify
          mkdir -p build/Payload
          cp -R build/French.xcarchive/Products/Applications/French.app build/Payload/
          cd build && zip -qry French.ipa Payload

      - name: Check IPA
        run: |
          app=build/Payload/French.app
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Info.plist"; }
          test ! -e "$app/_CodeSignature" || { echo "IPA must be unsigned"; exit 1; }
          test ! -e "$app/embedded.mobileprovision" || { echo "IPA must not embed a profile"; exit 1; }
          test ! -d "$app/PlugIns" || { echo "Extensions break re-signing with a plain profile"; exit 1; }
          test "$(lipo -archs "$app/French")" = arm64
          test "$(plist MinimumOSVersion)" = 26.0
          echo "bundle id: $(plist CFBundleIdentifier), build $(plist CFBundleVersion), $(du -h build/French.ipa | cut -f1)"

      - uses: actions/upload-artifact@v7
        with:
          name: French-ipa
          path: build/French.ipa

      # One rolling release, so the download link never changes:
      # https://github.com/<owner>/<repo>/releases/latest/download/French.ipa
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/French.ipa --target "$GITHUB_SHA" \
            --title "Build $GITHUB_RUN_NUMBER" \
            --notes "Unsigned IPA for iOS 26 or later. Sign and install it with ESign or another sideloading tool."
